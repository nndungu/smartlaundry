# ===============================
# APPLICATION TEST CONFIG
# ===============================
spring.application.name=SmartLaundry-Test
server.port=8081

# ===============================
# DATABASE (Test DB)
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_TEST:smartlaundry_test}
spring.datasource.username=${DB_USER:laundry_admin}
spring.datasource.password=${DB_PASSWORD:@Aw35omes}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisDialect
spring.jpa.defer-datasource-initialization=true

# ===============================
# Flyway (Test DB migrations & seed)
# ===============================
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# Remove spring.sql.init entirely to prevent double seeding

# ===============================
# GOOGLE OAUTH
# ===============================
google.client.id=${GOOGLE_CLIENT_ID:dummy-client-id}
google.client.secret=${GOOGLE_CLIENT_SECRET:dummy-secret}
google.redirect.uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/oauth2/callback}

# ===============================
# M-PESA (Sandbox for testing)
# ===============================
mpesa.env=${MPESA_ENV:sandbox}
mpesa.consumerKey=${MPESA_CONSUMERKEY:sandbox-consumer-key}
mpesa.consumerSecret=${MPESA_CONSUMERSECRET:sandbox-consumer-secret}
mpesa.shortcode=${MPESA_SHORTCODE:174379}
mpesa.passkey=${MPESA_PASSKEY:sandbox-passkey}
mpesa.callbackUrl=${MPESA_CALLBACKURL:http://localhost:8081/api/payments/mpesa/callback}
mpesa.base.url=${MPESA_BASEURL:https://sandbox.safaricom.co.ke}

# ===============================
# Third-party APIs (Sandbox / Dummy)
# ===============================
africastalking.username=${AFRICASTALKING_USERNAME:dummyuser}
africastalking.apiKey=${AFRICASTALKING_API_KEY:dummykey}
africastalking.senderId=${AFRICASTALKING_SENDER_ID:DUMMY}

# ===============================
# Logging
# ===============================
logging.level.root=DEBUG
logging.level.ke.co.smartlaundry=DEBUG
logging.level.org.flywaydb=DEBUG
logging.file.name=logs/smartlaundry-test.log
