spring.application.name=SmartLaundry

spring.config.import=optional:file:.env[.properties]
spring.main.banner-mode=off

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_DEV:smartlaundry_dev}
spring.datasource.username=${DB_USER:laundry_admin}
spring.datasource.password=${DB_PASSWORD:@Aw35omes}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate - Flyway controls schema
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# SQL Data Seed
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/migration/V2__dev_seed.sql
spring.sql.init.continue-on-error=true

# JWT
jwt.secret=${JWT_SECRET:bf343c55a235c3c70b0c45b115987867784cc9e5fac8931c29003f113b7b11287dd2fa80d87c70f6adef647d3a82c72a906f7671efdf379d729425109de2782e}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Mail (RE-ENABLED)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

