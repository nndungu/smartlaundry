server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME_DEV}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisDialect

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__schema.sql
spring.sql.init.data-locations=classpath:db/migration/dev-seed/V2__dev_seed.sql
spring.sql.init.continue-on-error=true
