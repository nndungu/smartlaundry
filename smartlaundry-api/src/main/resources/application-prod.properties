# ==============================
# SPRING BOOT CONFIG
# ==============================
spring.application.name=SmartLaundry
server.port=8080
spring.main.banner-mode=off

# ==============================
# DATABASE (Render PostgreSQL)
# ==============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# FLYWAY MIGRATIONS
# ==============================
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.placeholder-replacement=true


# ==============================
# JWT
# ==============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ==============================
# Admin passcode
# ==============================
admin.registration.passcode=${ADMIN_REGISTRATION_PASSCODE}


# ==============================
# EMAIL
# ==============================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==============================
# M-PESA (PRODUCTION)
# ==============================
mpesa.env=${MPESA_ENV}
mpesa.base.url=${MPESA_BASEURL}
mpesa.consumerKey=${MPESA_CONSUMERKEY}
mpesa.consumerSecret=${MPESA_CONSUMERSECRET}
mpesa.shortcode=${MPESA_SHORTCODE}
mpesa.passkey=${MPESA_PASSKEY}
mpesa.callbackUrl=${MPESA_CALLBACKURL}

# ==============================
# AFRICA'S TALKING
# ==============================
africastalking.username=${AFRICASTALKING_USERNAME}
africastalking.apiKey=${AFRICASTALKING_API_KEY}
africastalking.senderId=${AFRICASTALKING_SENDER_ID}

# ==============================
# Google OAuth2
# ==============================
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.redirect.uri=${GOOGLE_REDIRECT_URI}

# ==============================
# Logging
# ==============================
logging.level.root=INFO
logging.level.ke.co.smartlaundry=DEBUG
logging.file.name=logs/smartlaundry.log
