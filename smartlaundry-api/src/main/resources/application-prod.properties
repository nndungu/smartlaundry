spring.config.activate.on-profile=prod

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME_PROD}
spring.datasource.username=${DB_USER_PROD}
spring.datasource.password=${DB_PASSWORD_PROD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration,classpath:db

# Production Services (unchanged)
africastalking.username=${AFRICASTALKING_USERNAME}
africastalking.apiKey=${AFRICASTALKING_API_KEY}
africastalking.senderId=${AFRICASTALKING_SENDER_ID}

# ============================================
# ? M-PESA DARAJA CONFIGURATION
# ============================================
mpesa.env=${MPESA_ENV}
mpesa.consumerKey=${MPESA_CONSUMERKEY}
mpesa.consumerSecret=${MPESA_CONSUMERSECRET}
mpesa.shortcode=${MPESA_SHORTCODE:174379}
mpesa.passkey=${MPESA_PASSKEY}
mpesa.callbackUrl=${MPESA_CALLBACKURL}
mpesa.base.url=${MPESA_BASEURL}

google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.redirect.uri=${GOOGLE_REDIRECT_URI}

