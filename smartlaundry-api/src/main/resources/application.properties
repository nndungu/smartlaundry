spring.application.name=SmartLaundry
server.port=8080

spring.config.import=optional:file:.env.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ===============================
# DATABASE (Render / Docker)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# Email
# ===============================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# MPESA (Sandbox safe defaults)
# ===============================
mpesa.base.url=${MPESA_BASEURL:https://sandbox.safaricom.co.ke}
mpesa.env=${MPESA_ENV:sandbox}
mpesa.consumerKey=${MPESA_CONSUMERKEY}
mpesa.consumerSecret=${MPESA_CONSUMERSECRET}
mpesa.shortcode=${MPESA_SHORTCODE:174379}
mpesa.passkey=${MPESA_PASSKEY}
mpesa.callbackUrl=${MPESA_CALLBACKURL}

# ===============================
# Africa?s Talking
# ===============================
africastalking.username=${AFRICASTALKING_USERNAME}
africastalking.apiKey=${AFRICASTALKING_API_KEY}
africastalking.senderId=${AFRICASTALKING_SENDER_ID}

# ===============================
# Google OAuth
# ===============================
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.redirect.uri=${GOOGLE_REDIRECT_URI}

