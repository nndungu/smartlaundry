spring.application.name=SmartLaundry
server.address=0.0.0.0
server.port=8080

# Load optional properties from .env.properties
spring.config.import=optional:file:.env.properties
spring.main.banner-mode=off
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartlaundry_db}
spring.datasource.username=${DB_USER:laundry_admin}
spring.datasource.password=${DB_PASSWORD:@Aw35omes}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:default_jwt_secret}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# Mail
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# M-PESA
# Provide safe defaults to avoid startup errors
# ===============================
mpesa.base.url=${MPESA_BASEURL:https://sandbox.safaricom.co.ke}
mpesa.env=${MPESA_ENV:sandbox}
mpesa.consumerKey=${MPESA_CONSUMERKEY:dummy}
mpesa.consumerSecret=${MPESA_CONSUMERSECRET:dummy}
mpesa.shortcode=${MPESA_SHORTCODE:174379}
mpesa.passkey=${MPESA_PASSKEY:dummy}
mpesa.callbackUrl=${MPESA_CALLBACKURL:https://sandbox.safaricom.co.ke/callback}


# ===============================
# Africa's Talking
# ===============================
africastalking.username=${AFRICASTALKING_USERNAME}
africastalking.apiKey=${AFRICASTALKING_API_KEY}
africastalking.senderId=${AFRICASTALKING_SENDER_ID}

# ===============================
# Google OAuth
# ===============================
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.redirect.uri=${GOOGLE_REDIRECT_URI}

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.ke.co.smartlaundry=DEBUG
logging.level.org.flywaydb=DEBUG
logging.file.name=logs/smartlaundry.log
