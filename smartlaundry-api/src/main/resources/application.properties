# ==============================
# SPRING BOOT BASE CONFIG
# ==============================
spring.application.name=SmartLaundry
server.port=8080
spring.main.banner-mode=off

# Load optional environment variables (local override)
spring.config.import=optional:file:.env.properties

# Default profile: prod on Render, can be overridden locally
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ==============================
# DATABASE (common defaults)
# ==============================
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate common defaults
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# FLYWAY (migrations)
# ==============================
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.placeholder-replacement=true

# ==============================
# JWT (common defaults)
# ==============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ==============================
# Admin passcode
# ==============================
admin.registration.passcode=${ADMIN_REGISTRATION_PASSCODE}


# ==============================
# EMAIL (common defaults)
# ==============================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==============================
# M-PESA (common defaults)
# ==============================
mpesa.env=${MPESA_ENV}
mpesa.base.url=${MPESA_BASEURL}
mpesa.consumerKey=${MPESA_CONSUMERKEY}
mpesa.consumerSecret=${MPESA_CONSUMERSECRET}
mpesa.shortcode=${MPESA_SHORTCODE}
mpesa.passkey=${MPESA_PASSKEY}
mpesa.callbackUrl=${MPESA_CALLBACKURL}

# ==============================
# AFRICA'S TALKING (common defaults)
# ==============================
africastalking.username=${AFRICASTALKING_USERNAME}
africastalking.apiKey=${AFRICASTALKING_API_KEY}
africastalking.senderId=${AFRICASTALKING_SENDER_ID}

# ==============================
# GOOGLE OAUTH2
# ==============================
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.redirect.uri=${GOOGLE_REDIRECT_URI}

# ==============================
# LOGGING
# ==============================
logging.level.root=INFO
logging.level.ke.co.smartlaundry=DEBUG
logging.file.name=logs/smartlaundry.log
