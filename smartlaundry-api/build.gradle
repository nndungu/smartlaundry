buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.postgresql:postgresql:42.7.3"
        classpath "org.flywaydb:flyway-database-postgresql:10.16.0"
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '10.16.0'
}

group = 'ke.co'
version = '0.0.1-SNAPSHOT'
description = 'smartlaundry-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    // --- Spring Boot Starters ---
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'


    // --- Hibernate Spatial / PostGIS ---
    implementation 'org.hibernate.orm:hibernate-spatial:6.6.1.Final'
    runtimeOnly 'org.postgresql:postgresql:42.7.3'

    // --- OpenAPI / Swagger ---
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // --- Google API ---
    implementation 'com.google.api-client:google-api-client:2.2.0'
    implementation 'com.google.oauth-client:google-oauth-client:1.34.1'
    implementation 'com.google.http-client:google-http-client-jackson2:1.43.3'

    // --- JWT ---
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'io.jsonwebtoken') {
                details.useVersion '0.12.6'
            }
        }
    }

    // --- Lombok ---
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    // --- Environment Variables ---
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // --- Test Dependencies ---
    testImplementation platform('org.junit:junit-bom:5.12.1')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// --- Flyway using environment variables for Render ---
flyway {
    url = System.getenv('SPRING_DATASOURCE_URL') ?: 'jdbc:postgresql://localhost:5432/smartlaundry_db'
    user = System.getenv('SPRING_DATASOURCE_USERNAME') ?: 'laundry_admin'
    password = System.getenv('SPRING_DATASOURCE_PASSWORD') ?: '@Aw35omes'
    schemas = ['public']
    locations = ['filesystem:src/main/resources/db/migration']
    cleanDisabled = false
}

// --- Ensure bootJar knows the main class ---
tasks.named('bootJar') {
    mainClass = 'ke.co.smartlaundry.SmartlaundryApiApplication'
}

// --- Configure test task ---
tasks.named('test') {
    useJUnitPlatform()
}
