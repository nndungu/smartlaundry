<div class="vendor-container">
    <!-- Sidebar Navigation -->
    <nav class="sidebar" [class.open]="sidebarOpen" id="sidebar" role="navigation" aria-label="Main navigation">
        <div class="logo">SmartLaundry</div>
        <ul class="nav-menu">
            <li class="nav-item" [class.active]="activeSection === 'dashboard'" data-page="dashboard" (click)="navigateToSection('dashboard')" tabindex="0" role="menuitem" (keydown.enter)="navigateToSection('dashboard')" (keydown.space)="navigateToSection('dashboard')" aria-current="page">
                <span class="nav-icon">📊</span>
                <span class="nav-text">Dashboard</span>
            </li>
            <li class="nav-item" [class.active]="activeSection === 'orders'" data-page="orders" (click)="navigateToSection('orders')" tabindex="0" role="menuitem" (keydown.enter)="navigateToSection('orders')" (keydown.space)="navigateToSection('orders')">
                <span class="nav-icon">📋</span>
                <span class="nav-text">Orders</span>
            </li>
            <li class="nav-item" [class.active]="activeSection === 'profile'" data-page="profile" (click)="navigateToSection('profile')" tabindex="0" role="menuitem" (keydown.enter)="navigateToSection('profile')" (keydown.space)="navigateToSection('profile')">
                <span class="nav-icon">👤</span>
                <span class="nav-text">Profile</span>
            </li>
            <li class="nav-item" [class.active]="activeSection === 'payments'" data-page="payments" (click)="navigateToSection('payments')" tabindex="0" role="menuitem" (keydown.enter)="navigateToSection('payments')" (keydown.space)="navigateToSection('payments')">
                <span class="nav-icon">💳</span>
                <span class="nav-text">Payments</span>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content" tabindex="0">
        <!-- Header -->
        <header class="page-header">
            <button class="hamburger-btn" aria-label="Toggle sidebar" aria-expanded="false" aria-controls="sidebar" (click)="toggleSidebar()">
                ☰
            </button>
            <div class="search-container">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" placeholder="Search..." id="searchInput" class="search-input" />
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="notificationBtn">🔔</button>
                <button class="icon-btn" id="profileBtn">👤</button>
            </div>
        </header>

        <router-outlet></router-outlet>
    </main>
</div>

<!-- Order Details Modal -->
<div class="modal-overlay" id="orderDetailsModal">
    <div class="modal">
        <div class="modal-header">
            <h3>Order Details</h3>
            <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body" id="orderDetailsBody">
            <!-- Order details will be populated here -->
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="closeModalBtn">Close</button>
            <button class="btn btn-danger" id="rejectOrderBtn">❌ Reject</button>
            <button class="btn btn-success" id="acceptOrderBtn">✅ Accept</button>
        </div>
    </div>
</div>

<!-- Status Update Modal -->
<div class="modal-overlay" id="statusUpdateModal">
    <div class="modal">
        <div class="modal-header">
            <h3>Update Order Status</h3>
            <button class="modal-close" id="statusModalClose">&times;</button>
        </div>
        <div class="modal-body">
            <div class="current-status" id="currentStatusDisplay">
                <!-- Current status will be shown here -->
            </div>
            <div class="form-group">
                <label for="newStatus">Update Status To:</label>
                <select id="newStatus" class="form-select">
                    <option value="">Select New Status</option>
                    <option value="accepted">Accepted</option>
                    <option value="picked">Picked Up</option>
                    <option value="in-transit">In Transit</option>
                    <option value="delivered">Delivered</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
            <div class="form-group">
                <label for="statusNotes">Notes (Optional)</label>
                <textarea id="statusNotes" placeholder="Add any notes about this status update..." rows="3"></textarea>
            </div>
            <div class="form-group" id="deliveryPhotoSection" style="display: none;">
                <label for="deliveryPhoto">Delivery Photo</label>
                <input type="file" id="deliveryPhoto" accept="image/*">
                <small>Upload a photo as proof of delivery</small>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelStatusBtn">Cancel</button>
            <button class="btn btn-primary" id="confirmStatusBtn">Update Status</button>
        </div>
    </div>
</div>

<!-- Rejection Reason Modal -->
<div class="modal-overlay" id="rejectionModal">
    <div class="modal">
        <div class="modal-header">
            <h3>Reject Order</h3>
            <button class="modal-close" id="rejectionModalClose">&times;</button>
        </div>
        <div class="modal-body">
            <p>Please provide a reason for rejecting this order:</p>
            <div class="form-group">
                <label for="rejectionReason">Rejection Reason</label>
                <select id="rejectionReason" class="form-select">
                    <option value="">Select a reason</option>
                    <option value="vehicle-breakdown">Vehicle Breakdown</option>
                    <option value="too-far">Location Too Far</option>
                    <option value="time-conflict">Time Conflict</option>
                    <option value="overbooked">Already Overbooked</option>
                    <option value="weather">Bad Weather Conditions</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="rejectionNotes">Additional Notes</label>
                <textarea id="rejectionNotes" placeholder="Provide additional details..." rows="3"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelRejectionBtn">Cancel</button>
            <button class="btn btn-danger" id="confirmRejectionBtn">Confirm Rejection</button>
        </div>
    </div>
</div>

<!-- Success/Error Toast -->
<div class="toast-container" id="toastContainer">
    <!-- Toast messages will appear here -->
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <p>Processing...</p>
</div>
