<div class="dashboard-container">
  <!-- Sidebar Navigation -->
  <nav class="sidebar">
    <div class="logo">SmartLaundry</div>
    <ul class="nav-menu">
      <li class="nav-item active" data-page="dashboard">
        <span class="nav-icon">📊</span>
        <span class="nav-text">Dashboard</span>
      </li>
      <li class="nav-item" data-page="orders">
        <span class="nav-icon">📦</span>
        <span class="nav-text">Orders</span>
      </li>
      <li class="nav-item" data-page="profile">
        <span class="nav-icon">👤</span>
        <span class="nav-text">Profile</span>
      </li>
    </ul>
  </nav>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- Header -->
    <header class="dashboard-header">
      <div class="search-container">
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Search..." id="searchInput" class="search-input" />
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="notificationBtn" title="Notifications">🔔</button>
        <button class="icon-btn" id="profileBtn" title="Profile">👤</button>
      </div>
    </header>

    <!-- Vendor Dashboard Title -->
    <section class="welcome-section">
      <h1 class="welcome-title">Vendor Dashboard</h1>
    </section>

    <!-- Orders Table -->
    <section class="history-section">
      <div class="table-container">
        <table class="order-table" id="orderTable">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Status</th>
              <th>Status</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="orderTableBody">
            <tr class="order-row" data-order="1234">
              <td class="order-id">#1234</td>
              <td class="order-status-text">Picked</td>
              <td class="order-status-badge">
                <span class="status-badge completed">Picked</span>
              </td>
              <td class="order-total">KES 500</td>
            </tr>
            <tr class="order-row" data-order="1235">
              <td class="order-id">#1235</td>
              <td class="order-status-text">Janess</td>
              <td class="order-status-badge"></td>
              <td class="order-total">KES 800</td>
            </tr>
            <tr class="order-row" data-order="1236">
              <td class="order-id">#1236</td>
              <td class="order-status-text">Bob Johnson</td>
              <td class="order-status-badge"></td>
              <td class="order-total">KES 600</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Earnings Chart -->
    <section class="earnings-section">
      <h2 class="section-title">Earnings</h2>
      <svg id="earningsChart" width="100%" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" aria-label="Earnings Chart" role="img">
        <defs>
          <linearGradient id="gradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4285f4" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#4285f4" stop-opacity="0" />
          </linearGradient>
        </defs>
        <path id="linePath" fill="url(#gradient)" stroke="#4285f4" stroke-width="3" fill-opacity="0.3" />
        <polyline id="linePolyline" fill="none" stroke="#4285f4" stroke-width="3" />
        <g id="pointsGroup" fill="#4285f4" />
        <g id="xAxisLabels" fill="#5f6368" font-size="14" font-family="Arial, sans-serif" />
        <g id="yAxisLabels" fill="#5f6368" font-size="14" font-family="Arial, sans-serif" />
      </svg>
    </section>
  </main>
</div>
