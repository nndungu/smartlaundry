<div class="flex h-screen">
  <aside class="bg-[#0B4F8A] text-white w-64 p-6 flex flex-col">
    <!-- Logo Section -->
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-white">SmartLaundry</h1>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex-1">
      <ul class="space-y-2">
        <li>
          <a
            routerLink=""
            routerLinkActive="bg-[#1E90FF] text-white"
            class="flex items-center px-4 py-3 rounded-lg hover:bg-[#1E90FF] transition-colors duration-200 group">
            <svg class="w-5 h-5 mr-3 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Dashboard
          </a>
        </li>

        <li>
          <a
            routerLink="orders"
            routerLinkActive="bg-[#1E90FF] text-white"
            class="flex items-center px-4 py-3 rounded-lg hover:bg-[#1E90FF] transition-colors duration-200 group">
            <svg class="w-5 h-5 mr-3 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
            Orders
          </a>
        </li>

        <li>
          <a
            routerLink="profile"
            routerLinkActive="bg-[#1E90FF] text-white"
            class="flex items-center px-4 py-3 rounded-lg hover:bg-[#1E90FF] transition-colors duration-200 group">
            <svg class="w-5 h-5 mr-3 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Profile
          </a>
        </li>
      </ul>
    </nav>

    <!-- User Info Section -->
    <div class="pt-6 mt-6 border-t border-[#1E90FF]">
      <div class="flex items-center">
        <div class="w-10 h-10 bg-[#1E90FF] rounded-full flex items-center justify-center">
          <span class="font-semibold">{{ getUserInitials() }}</span>
        </div>
        <div class="ml-3">
          <p class="text-sm font-medium">{{ userName }}</p>
          <p class="text-xs text-blue-200">{{ userRole }}</p>
        </div>
      </div>

      <!-- Logout Button -->
      <button
        (click)="logout()"
        class="w-full mt-4 flex items-center justify-center px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg transition-colors duration-200 group">
        <svg class="w-4 h-4 mr-2 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Logout
      </button>
    </div>
  </aside>
  <main class="flex-1 overflow-auto">
    <router-outlet></router-outlet>
  </main>
</div>
