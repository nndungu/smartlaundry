<div class="dashboard-container">
    <!-- Sidebar Navigation -->
    <nav class="sidebar" [class.mobile-open]="isMobileMenuOpen">
        <div class="logo">SmartLaundry</div>
        <ul class="nav-menu">
            <li
                *ngFor="let item of navItems"
                class="nav-item"
                [class.active]="item.active"
                (click)="navigateToPage(item.id)">
                <span class="nav-icon">{{ item.icon }}</span>
                <span class="nav-text">{{ item.text }}</span>
            </li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="search-container">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" placeholder="Search orders, services..." class="search-input" (input)="handleSearch($event)">
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" (click)="openCart()" title="Cart">
                    🛒
                    <span class="notification-badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
                </button>
                <button class="icon-btn" (click)="openNotifications()" title="Notifications">
                    🔔
                    <span class="notification-badge">{{ notificationCount }}</span>
                </button>
                <button class="icon-btn" (click)="openProfile()" title="Profile">
                    👤
                </button>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <div class="content-area">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" *ngIf="isLoading">
    <div class="loading-spinner"></div>
    <p>Loading your dashboard...</p>
</div>
