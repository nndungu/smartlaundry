server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME_TEST}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisDialect

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__schema.sql
spring.sql.init.data-locations=classpath:db/migration/test-data/V3__test_seed.sql
spring.sql.init.continue-on-error=true

google.client.id=test-id
google.client.secret=test-secret
google.redirect.uri=http://localhost/test

# disable external integrations
mpesa.baseUrl=http://test
mpesa.consumerKey=test
mpesa.consumerSecret=test
mpesa.shortcode=00000
mpesa.passkey=test


africastalking.username=test
africastalking.apiKey=test

logging.file.name=logs/smartlaundry-test.log
